server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:sqlite:./data/smartroom.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.web.resources.static-locations=file:../frontend/
spring.mvc.static-path-pattern=/**
smartroom.mqtt.url=${MQTT_URL:tcp://localhost:1884}
smartroom.mqtt.username=${MQTT_USERNAME:}
smartroom.mqtt.password=${MQTT_PASSWORD:}
