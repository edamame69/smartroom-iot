server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:sqlite:./data/smartroom.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.web.resources.static-locations=file:../frontend/
spring.mvc.static-path-pattern=/**
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.max-age=7d
server.servlet.session.timeout=7d
smartroom.mqtt.url=${MQTT_URL:tcp://localhost:1884}
smartroom.mqtt.username=${MQTT_USERNAME:}
smartroom.mqtt.password=${MQTT_PASSWORD:}
