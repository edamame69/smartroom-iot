<body><small>SMART ROOM IOT</small><h1>Cảm biến và dữ liệu</h1><p>DHT11 đo nhiệt độ (°C) và độ ẩm (%). Cảm biến ở chân A0 trả giá trị ánh sáng ADC 0–1023. ESP8266 gửi số đo qua MQTT; backend lưu trong SQLite. Bộ tìm kiếm hỗ trợ giá trị chính xác và thời gian từ năm đến giây.</p><footer>Tài liệu Smart Room IoT.</footer></body></html>
