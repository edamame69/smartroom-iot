<body><small>SMART ROOM IOT</small><h1>Điều khiển và lịch sử</h1><p>Quạt và đèn tương ứng với hai LED D6 và D7. Backend lưu lệnh ở trạng thái “Đang chờ”, gửi MQTT và đợi ESP8266 xác nhận. Lịch sử chuyển thành “Thành công” khi nhận phản hồi khớp, hoặc “Thất bại” sau 10 giây.</p><footer>Tài liệu Smart Room IoT.</footer></body></html>
