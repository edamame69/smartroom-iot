<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng ký - Smart Room IoT</title>
  <script src="js/theme.js?v=theme2"></script>
  <link rel="stylesheet" href="css/base.css?v=theme2">
  <link rel="stylesheet" href="css/login.css?v=theme2">
  <link rel="stylesheet" href="css/redesign.css?v=authcenter1">
</head>
<body>
  <button class="btn theme-toggle auth-theme-toggle" type="button" data-theme-toggle>Chế độ tối</button>
  <main class="auth-page">
    <aside class="auth-hero"><div class="auth-hero-top"><span class="auth-mark"><i data-icon="activity"></i></span>
      <span><strong>SMART ROOM IOT</strong><small>Monitoring & Control</small></span></div>
      <div class="auth-hero-copy"><span class="hero-pill">● HỆ THỐNG SMART ROOM IOT</span>
        <h2>Bắt đầu khám phá Smart Room.</h2><p>Tạo tài khoản để theo dõi cảm biến và điều khiển thiết bị.</p></div>
    </aside>
    <form class="auth-card" id="register-form" novalidate>
      <div class="auth-logo"><i data-icon="home"></i></div>
      <h1 class="auth-title">Smart Room IoT</h1>
      <p class="auth-sub">Tạo tài khoản Smart Room IoT của bạn</p>

      <div id="form-error" class="form-error hidden"></div>

      <div class="field">
        <label for="username">Tên đăng nhập</label>
        <div class="input-wrap">
          <i data-icon="user"></i>
          <input class="input" id="username" type="text" placeholder="Nhập tên đăng nhập" autocomplete="username">
        </div>
        <div class="field-error" id="username-error"></div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <div class="input-wrap">
          <i data-icon="mail"></i>
          <input class="input" id="email" type="email" placeholder="Nhập email của bạn" autocomplete="email">
        </div>
        <div class="field-error" id="email-error"></div>
      </div>

      <div class="field">
        <label for="password">Mật khẩu</label>
        <div class="input-wrap has-eye">
          <i data-icon="lock"></i>
          <input class="input" id="password" type="password" placeholder="Nhập mật khẩu" autocomplete="new-password">
          <button type="button" class="toggle-eye" data-target="password" aria-label="Hiện/ẩn mật khẩu"></button>
        </div>
        <div class="field-error" id="password-error"></div>
      </div>

      <div class="field">
        <label for="confirm">Xác nhận mật khẩu</label>
        <div class="input-wrap has-eye">
          <i data-icon="lock"></i>
          <input class="input" id="confirm" type="password" placeholder="Nhập lại mật khẩu" autocomplete="new-password">
          <button type="button" class="toggle-eye" data-target="confirm" aria-label="Hiện/ẩn mật khẩu"></button>
        </div>
        <div class="field-error" id="confirm-error"></div>
      </div>

      <div class="field">
        <label class="check" style="font-weight:400">
          <input type="checkbox" id="terms">
          <span>Tôi đồng ý với <a href="#" class="soft-link">Điều khoản sử dụng</a> và <a href="#" class="soft-link">Chính sách bảo mật</a></span>
        </label>
        <div class="field-error" id="terms-error"></div>
      </div>

      <button class="btn btn-primary btn-block" type="submit" id="submit"><i data-icon="userPlus"></i>Đăng ký</button>

      <div class="auth-or">HOẶC</div>
      <p class="auth-foot">Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a></p>
    </form>
  </main>

  <script src="js/utils.js?v=theme2"></script>
  <script src="js/auth.js?v=theme2"></script>
  <script src="js/api.js?v=live2"></script>
  <script src="js/register.js?v=theme2"></script>
</body>
</html>
